<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROS Map Visualization</title>
    <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/roslibjs/1.1.0/roslib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ros2d@0.10.0/build/ros2d.min.js"></script>
  </head>
  <body>
    <div id="mapCanvas" style="width: 800px; height: 600px"></div>
    <script>
      var ros = new ROSLIB.Ros({
        url: "ws://localhost:9092",
      });

      ros.on("connection", () => {
        console.log("Connected to ROS");
      });

      ros.on("error", (err) => {
        console.log("Error connecting to ROS:", err);
      });

      ros.on("close", () => {
        console.log("Connection to ROS closed");
      });

      var viewer = new ROS2D.Viewer({
        divID: "mapCanvas",
        width: 800,
        height: 600,
      });

      var gridClient = new ROS2D.OccupancyGridClient({
        ros: ros,
        rootObject: viewer.scene,
        continuous: true,
      });

      gridClient.on("change", function () {
        viewer.scaleToDimensions(
          gridClient.currentGrid.width,
          gridClient.currentGrid.height
        );
        viewer.shift(
          gridClient.currentGrid.pose.position.x,
          gridClient.currentGrid.pose.position.y
        );
      });
    </script>
  </body>
</html>
